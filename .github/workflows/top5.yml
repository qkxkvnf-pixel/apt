name: 지점별 TOP5 업데이트

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 한국시간 오전 6시
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: TOP5 계산
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python update_top5.py
      - name: 결과 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add top5 geocache.json
          git diff --staged --quiet || git commit -m "TOP5 자동 업데이트"
          git push
